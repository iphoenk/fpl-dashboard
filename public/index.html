<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FPL Dashboard</title>
  <meta name="description" content="Personal FPL dashboard: projections, planning, mini-league and scouting for any team ID.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">FPL Dashboard<small id="gw-label"></small></div>
      <form class="team-form" id="team-form" autocomplete="off">
        <input id="team-input" inputmode="numeric" pattern="[0-9]*" placeholder="Team ID" aria-label="FPL team ID">
        <select id="league-select" aria-label="Mini-league" class="hidden"></select>
        <button class="btn" type="submit">Load</button>
        <button class="btn ghost icon-btn" type="button" id="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">&#9680;</button>
      </form>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="overview" aria-selected="true">Overview</button>
      <button role="tab" data-view="planning" aria-selected="false">Planning</button>
      <button role="tab" data-view="market" aria-selected="false">Market</button>
      <button role="tab" data-view="league" aria-selected="false">Mini-league</button>
      <button role="tab" data-view="scout" aria-selected="false">Scout</button>
    </nav>
  </header>

  <main>
    <section class="view active" id="view-overview"></section>
    <section class="view" id="view-planning"></section>
    <section class="view" id="view-market"></section>
    <section class="view" id="view-league"></section>
    <section class="view" id="view-scout"></section>
  </main>

  <footer id="footer"></footer>

  <dialog class="modal" id="modal">
    <div class="modal-head"><div id="modal-title"></div><button class="btn ghost" id="modal-close" type="button">Close</button></div>
    <div class="modal-body" id="modal-body"></div>
  </dialog>
  <div class="tip" id="tip"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
